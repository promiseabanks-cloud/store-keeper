# Local development stack: WordPress multisite + MariaDB + Redis + Mailpit (§6.2, §7.1).
# Production must not use shared hosting (§23). Copy .env.example to .env first.
services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-storekeeper}
      MARIADB_USER: ${DB_USER:-storekeeper}
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root-local-only}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-flush-log-at-trx-commit=1
    volumes:
      - db-data:/var/lib/mysql
      - ./tools/docker/init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  wordpress:
    image: wordpress:6.7-php8.3-apache
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-storekeeper}
      WORDPRESS_DB_USER: ${DB_USER:-storekeeper}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change-me-locally}
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_DEBUG', true);
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);
        define('MULTISITE', true);
        define('SUBDOMAIN_INSTALL', false);
        define('DOMAIN_CURRENT_SITE', 'localhost');
        define('PATH_CURRENT_SITE', '/');
        define('SITE_ID_CURRENT_SITE', 1);
        define('BLOG_ID_CURRENT_SITE', 1);
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WSP_ENCRYPTION_KEY', getenv('WSP_ENCRYPTION_KEY') ?: 'local-development-only-key-32-chars');
    volumes:
      - wp-data:/var/www/html
      - ./plugins/storekeeper-commerce:/var/www/html/wp-content/plugins/storekeeper-commerce:ro
      - ./plugins/storekeeper-platform:/var/www/html/wp-content/plugins/storekeeper-platform:ro
      - ./plugins/storekeeper-mu-loader:/var/www/html/wp-content/mu-plugins/storekeeper-mu-loader:ro
    ports:
      - "8080:80"

  wp-cli:
    image: wordpress:cli-php8.3
    depends_on:
      - wordpress
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME:-storekeeper}
      WORDPRESS_DB_USER: ${DB_USER:-storekeeper}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change-me-locally}
    volumes:
      - wp-data:/var/www/html
      - ./plugins/storekeeper-commerce:/var/www/html/wp-content/plugins/storekeeper-commerce:ro
      - ./plugins/storekeeper-platform:/var/www/html/wp-content/plugins/storekeeper-platform:ro
    entrypoint: ["wp"]
    profiles: ["tools"]

volumes:
  db-data:
  redis-data:
  wp-data:
